<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Purchase History Mobile</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:20px 24px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800;text-align:center}.bb-sub{margin-top:6px;color:#6b7280;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card" id="bootCard">Loading Purchase History…<div class="bb-sub">Mobile · Secure Supabase</div></div></div>
<script>
(async function(){
'use strict';
const URL='https://sjfhlaclgmkwwofzstok.supabase.co';
const KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S';
const SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';
const boot=document.getElementById('bootCard');
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}
function saveSession(s){try{if(!s){localStorage.removeItem(SESSION_KEY);return}if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}catch(_){}}
async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.message||d.error_description||d.error||('Request failed ('+r.status+')'));return d}
async function ensure(){let s=readSession();if(!s?.access_token)throw new Error('Please sign in to BIG BROTHER first.');if(s.expires_at&&Number(s.expires_at)<Math.floor(Date.now()/1000)+45){if(!s.refresh_token)throw new Error('Your BIG BROTHER session has expired.');const r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});s=await parse(r);saveSession(s)}return s}
async function rpc(fn,args={}){const s=await ensure();const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(args||{}),cache:'no-store'});return parse(r)}
function key(v){return String(v||'').trim().toLowerCase()}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function assertPermission(){const p=await rpc('bb_current_access_profile');if(p?.user?.isAdmin===true)return p;const mods=Array.isArray(p?.modules)?p.modules:[];const grant=mods.find(x=>key(x.moduleKey)==='*')||mods.find(x=>key(x.moduleKey)==='route.purchase-history')||mods.find(x=>key(x.moduleKey)==='purchase_history');if(!grant||grant.canView!==true)throw new Error('You do not have permission to view Purchase History.');return p}
try{
  await assertPermission();
  const response=await fetch('index.html?v=20260915-2',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load Purchase History source.');
  let html=await response.text();
  const headClose=html.toLowerCase().indexOf('</head>');
  if(headClose<0)throw new Error('Purchase History source is missing </head>.');
  html=html.slice(0,headClose)+'<link rel="stylesheet" href="mobile-purchase-history.css?v=20260915-1">\n'+html.slice(headClose);
  const bodyClose=html.toLowerCase().lastIndexOf('</body>');
  if(bodyClose<0)throw new Error('Purchase History source is missing </body>.');
  html=html.slice(0,bodyClose)+'<script src="mobile-purchase-history.js?v=20260915-1"><\/script>\n'+html.slice(bodyClose);
  html=html.replace('<title>\n  BIG BROTHER — Purchase History\n</title>','<title>BIG BROTHER — Purchase History Mobile</title>');
  document.open();document.write(html);document.close();
}catch(error){
  console.error('Purchase History Mobile:',error);
  boot.innerHTML='Could not open Purchase History<div class="bb-sub">'+esc(error?.message||error)+'</div>';
}
})();
</script>
</body>
</html>
